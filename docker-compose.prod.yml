services:
  # 1. Production PostgreSQL Database (Private - No host port exposure)
  postgres:
    image: postgres:16-alpine
    container_name: medicore-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-medicore_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - medicore-network

  # 2. Production Express Backend API (Private - No host port exposure)
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-medicore-backend:latest}
    container_name: medicore-backend
    restart: always
    environment:
      - PORT=5000
      - DB_TYPE=postgres
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-postgres}
      - PG_DATABASE=${PG_DATABASE:-medicore_db}
    depends_on:
      - postgres
    networks:
      - medicore-network

  # 3. Production Nginx Reverse Proxy & Frontend Web Application
  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-medicore-frontend:latest}
    container_name: medicore-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medicore-network

volumes:
  pgdata:
    driver: local

networks:
  medicore-network:
    driver: bridge

